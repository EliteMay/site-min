<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="れんじ.css">
    <title>チーム開発</title>
</head>
<body>
    <main>
        <!--スタート画面-->
        <div id="suta-togamen">
            <img src="logo.png" alt="アプリロゴ" class="app-logo">
            <h1 class="app-title">Health Support</h1>
            <p class="app-subtitle">毎日の食事と運動をかんたん管理</p>
            <a>
                <button id="sutatobotan">スタート</button>
            </a>
            <a>
                <button id="tudukikara">続きから</button>
            </a>
        </div>
        <!--身長・体重入力画面-->
        <div class="hidden" id="syokinyuuryoku">
            <!--性別-->
            <h1>性別</h1>
            <label>
                <input type="radio" name="gender" value="男性">男性
            </label>
            <label>
                <input type="radio" name="gender" value="女性">女性
            </label>
            <!--年齢-->
            <h1>年齢</h1>
            <select name="年齢" id="nenrei">
                <option value="">1つ選択してください</option>
                <option value="seinen">18~29</option>
                <option value="tyuunen">30~49</option>
                <option value="kounen">50~64</option>
            </select>
            <!--身長-->
            <h1>身長</h1>
            <p>身長を入力してください</p>
            <input type="text" id="shintyo" value="" placeholder="例：170">
            <span>cm</span>
            <!--体重-->
            <h1>体重</h1>
            <p>体重を入力してください</p>
            <input type="text" id="taiju" value="" placeholder="例：60">
            <span>kg</span>
            <!--目標-->
            <div class="hidden" id="mokuhyou">
                <h2>目標</h2>
                <p>目標体重を入力してください</p>
                <input type="text" id="mtaiju" value="" placeholder="例：55">
                <span>kg</span>
                <p>目標BMIです。</p>
                <input type="text" id="mbmi" value="" placeholder="自動計算">
            </div>
            <p>
                <button class="" id="nyuryokutugihe">次へ</button>
            </p>
            <!--IDまとめ
                身長ID：shintyo
                体重ID：taiju
                目標体重：mtaiju
                目標BMI：mbmi
                次へボタン：nyuryokutugihe-->
        </div>
        <!--今日の入力画面-->
        <div class="hidden" id="sonohinyuuryokugamen">
            <h1>今日やったこと</h1>
            <!--食事内容-->
            <h2>今日食べたもの</h2>
            <!--ご飯-->
            <p>
                <label for="gohan">ご飯 :</label>
                <input type="number" id="gohan" min="0" placeholder="例：200">
                <span>g</span>
            </p>
            <!--麺-->
            <p>
                <label for="men">麺 :</label>
                <input type="number" id="men" min="0" placeholder="例：150">
                <span>g</span>
            </p>
            <!--パン-->
            <p>
                <label for="pan">パン :</label>
                <input type="number" id="pan" min="0" placeholder="例：100">
                <span>g</span>
            </p>
            <!--果物-->
            <p>
                <label for="kudamono">果物 :</label>
                <input type="number" id="kudamono" min="0" placeholder="例：100">
                <span>g</span>
            </p>
            <!--野菜-->
            <p>
                <label for="yasai">野菜 :</label>
                <input type="number" id="yasai" min="0" placeholder="例：150">
                <span>g</span>
            </p>
            <!--飲み物-->
            <p>
                <label for="nomimono">飲み物 :</label>
                <input type="number" id="nomimono" min="0" placeholder="例：500">
                <span>ml</span>
            </p>
            <!--運動-->
            <h2>行った運動</h2>
            <select name="運動" id="undousentaku">
                <option value="">1つ選択してください</option>
                <option value="running">ランニング</option>
                <option value="walking">ウォーキング</option>
                <option value="squat">スクワット</option>
            </select>
            <!--運動時間-->
            <div id="undoujikan">
                <label for="jikan">運動時間（分</label>
                <input type="number" id="jikan" min="1" placeholder="例：30">
                <span>分</span>
            </div>
            <!--カロリー計算-->
            <p>
                <button id="keisanButton">カロリーを計算</button>
            </p>
        </div>
        <!--結果画面-->
        <div class="hidden" id="sonohinokekka">
            <h1>今日の結果</h1>
            <!--消費カロリー-->
            <p>今日消費したカロリー ➡
                <span id="shkarori">0</span>kcal
            </p>
            <!--摂取カロリー-->
            <p>今日摂取したカロリー ➡
                <span id="sekarori">0</span>kcal
            </p>
            <!--達成率-->
            <h2>達成率</h2>
            <p>
                <span id="tasseiritsu">0</span>%
            </p>
            <!--明日のカロリー-->
            <h2>明日とっていいカロリー目安</h2>
            <p id="ashitakaori">---</p>
            <!--明日の運動-->
            <h2>明日やるべき運動目安</h2>
            <p id="ashinoUndou">---</p>
            <!--総評-->
            <h2>総評コメント</h2>
            <p id="souhyou">---</p>
            <!--最初に戻る-->
            <p>
                <button id="modoruButton">最初に戻る</button>
            </p>
        </div>
    </main>
    <!--JavaScript-->
    <script type="text/javascript" src="kcal.js"></script>
</body>
</html>
