<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>OAuthログイン（移転案内）</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6edf3}
main{width:min(520px,calc(100% - 32px));box-sizing:border-box;padding:24px;border-radius:16px;border:1px solid #30363d;background:#161b22}
p{line-height:1.7;color:#9da7b3}
a{color:#80bfff}
</style>
<script>
(function () {
  "use strict";
  // Compatibility route only. OAuth authentication and consent live in pc-agent.
  const destination = new URL("/pc-agent/oauth/login/", location.origin);
  destination.search = location.search;
  destination.hash = location.hash;
  location.replace(destination.href);
})();
</script>
</head>
<body>
<main>
  <h1>OAuthログインは移転しました</h1>
  <p>PC Agentの認証画面に移動しています。</p>
  <p>画面が切り替わらない場合は <a href="/pc-agent/oauth/login/">新しい認証画面を開く</a> を選んでください。認可の途中なら元の接続画面から再開してください。</p>
</main>
</body>
</html>
