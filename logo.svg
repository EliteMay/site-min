<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Health Support logo</title>
  <desc id="desc">A custom H monogram with a pulse line and sprouting leaf, representing food, movement, and daily health support.</desc>

  <!-- Main monogram: two soft pillars form an H without using a generic medical cross. -->
  <path fill="#37b64a" d="M116 165c0-24 19-43 43-43h18c24 0 43 19 43 43v73h72v-73c0-24 19-43 43-43h18c24 0 43 19 43 43v182c0 24-19 43-43 43h-18c-24 0-43-19-43-43v-69h-72v69c0 24-19 43-43 43h-18c-24 0-43-19-43-43V165z"/>

  <!-- Pulse path: the crossbar becomes a living, active rhythm. -->
  <path d="M145 258h60l18-28 28 58 25-45 17 15h74" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Growth leaf: unique top-right signature, angled to match the H stem. -->
  <path fill="#24953a" d="M314 112c14-46 49-75 99-81-2 50-32 84-81 96-8 2-16-6-18-15z"/>
  <path d="M325 111c23-29 49-49 76-61" fill="none" stroke="#37b64a" stroke-width="10" stroke-linecap="round"/>

  <!-- Support arc: subtle upward base, echoing the app's 'support' concept. -->
  <path d="M171 403c51 31 119 31 170 0" fill="none" stroke="#8fd79a" stroke-width="14" stroke-linecap="round"/>
</svg>
